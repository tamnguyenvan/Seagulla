[workspace]
resolver = "2"
members = [
  "crates/seagulla-core",
  "crates/seagulla-db",
  "crates/seagulla-media",
  "crates/seagulla-ml",
  "crates/seagulla-export",
  "crates/seagulla-platform",
  "crates/seagulla-ingest",
  "crates/seagulla-search",
  "crates/seagulla-cli",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
