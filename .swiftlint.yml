# SwiftLint configuration for Seagulla.
#
# swift-format owns formatting (see .swift-format); SwiftLint owns semantic lint rules.
# Rules that would fight the formatter are disabled here.

included:
  - Sources
  - Tests
  - Seagulla
  - Gallery

excluded:
  - .build
  - DerivedData
  - Seagulla.xcodeproj

disabled_rules:
  - trailing_comma          # swift-format manages trailing commas
  - opening_brace           # swift-format manages brace placement
  - todo                    # tracked in docs/execution-plan.md, not blocked here

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

line_length:
  warning: 100
  error: 140
  ignores_urls: true
  ignores_comments: false

# Lexicographic comparison of (major, minor, patch) is idiomatic and worth allowing.
large_tuple:
  warning: 3
  error: 4

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - to
    - at

type_body_length:
  warning: 300
  error: 450

file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20

nesting:
  type_level:
    warning: 2

reporter: "xcode"
